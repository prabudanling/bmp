<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Berkat Mandiri Pendingin logo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="55%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- Snowflake: one spoke, rotated 6x -->
  <g stroke="#ffffff" stroke-width="19" stroke-linecap="round" fill="none">
    <g id="spoke">
      <path d="M 256 250 L 256 74"/>
      <path d="M 256 158 L 224 126"/>
      <path d="M 256 158 L 288 126"/>
      <path d="M 256 112 L 230 86"/>
      <path d="M 256 112 L 282 86"/>
    </g>
    <use href="#spoke" transform="rotate(60 256 256)"/>
    <use href="#spoke" transform="rotate(120 256 256)"/>
    <use href="#spoke" transform="rotate(180 256 256)"/>
    <use href="#spoke" transform="rotate(240 256 256)"/>
    <use href="#spoke" transform="rotate(300 256 256)"/>
  </g>

  <!-- Center hub -->
  <circle cx="256" cy="256" r="30" fill="#ffffff"/>
  <circle cx="256" cy="256" r="13" fill="#0d9488"/>
</svg>
